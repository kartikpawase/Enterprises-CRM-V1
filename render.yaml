services:
  - type: web
    name: sr-enterprises-crm-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm@9.15.4 && pnpm install --frozen-lockfile && pnpm build:web && pnpm build:api
    startCommand: pnpm --filter @crm/api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.3
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384 --expose-gc
      - key: COOKIE_SAME_SITE
        value: lax
      - key: USE_POSTGRES
        value: "true"
      - key: DB_MAX_CONNECTIONS
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: ARCHIVE_DATABASE_URL
        sync: false
      - key: MAPS_JAVASCRIPT_API_KEY
        sync: false
      - key: ROUTES_API_KEY
        sync: false
      - key: MAP_ID
        sync: false
      - key: GOOGLE_MAPS_BROWSER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_MAP_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false

