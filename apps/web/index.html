<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B132B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" id="app-apple-title" content="CRM" />
    <meta name="application-name" id="app-name-meta" content="Enterprises CRM" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" id="app-apple-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Enterprises CRM - Commercial-grade SaaS for sales, service, warranty & job card management" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn / Telegram / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="Enterprises CRM" />
    <meta property="og:title" content="Enterprises CRM" />
    <meta property="og:description" content="Enterprises CRM - Commercial-grade SaaS for sales, service, warranty & job card management" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:secure_url" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Enterprises CRM" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="/" />
    <meta name="twitter:title" content="Enterprises CRM" />
    <meta name="twitter:description" content="Enterprises CRM - Commercial-grade SaaS for sales, service, warranty & job card management" />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta name="twitter:image:alt" content="Enterprises CRM" />

    <link rel="canonical" href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" id="app-manifest" href="/manifest-admin.webmanifest" />
    <title id="app-title">Enterprises CRM</title>

    <!-- Context-Aware Dynamic Manifest & App Identity Resolver (Synchronous pre-parse execution) -->
    <script>
      (function() {
        try {
          var isTech = window.location.pathname.startsWith('/technician');
          var manifestEl = document.getElementById('app-manifest');
          var appleTitleEl = document.getElementById('app-apple-title');
          var appNameEl = document.getElementById('app-name-meta');
          var appleIconEl = document.getElementById('app-apple-icon');
          var titleEl = document.getElementById('app-title');

          if (isTech) {
            if (manifestEl) manifestEl.setAttribute('href', '/manifest-technician.webmanifest');
            if (appleTitleEl) appleTitleEl.setAttribute('content', 'Technician');
            if (appNameEl) appNameEl.setAttribute('content', 'Enterprises Technician');
            if (appleIconEl) appleIconEl.setAttribute('href', '/apple-touch-icon-technician.png');
            if (titleEl) titleEl.textContent = 'Enterprises Technician';
            else document.title = 'Enterprises Technician';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Immediate Application Loading Screen Preload & Code-Based Styles -->
    <link rel="preload" as="image" href="/crm-logo.png" type="image/png" />
    <style>
      #crm-splash-screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #00091b;
        background: radial-gradient(ellipse at 50% 38%, #0a254a 0%, #031429 55%, #000818 100%);
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin: 0;
        padding: 24px 16px;
        box-sizing: border-box;
        transition: opacity 600ms cubic-bezier(0.16, 1, 0.3, 1), visibility 600ms cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
      }
      #crm-splash-screen.crm-splash-fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #crm-splash-screen.crm-splash-hidden {
        display: none !important;
      }
      .crm-splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        max-width: 480px;
        width: 100%;
        margin-top: -24px;
      }
      .crm-splash-logo-wrapper {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 24px rgba(14, 165, 233, 0.28));
      }
      .crm-splash-logo-img {
        width: 124px;
        height: 124px;
        border-radius: 28px;
        object-fit: contain;
        display: block;
      }
      @media (max-width: 480px) {
        .crm-splash-logo-img {
          width: 102px;
          height: 102px;
          border-radius: 22px;
        }
      }
      .crm-splash-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #ffffff;
        margin-bottom: 6px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .crm-splash-title-crm {
        color: #38bdf8;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      @media (max-width: 480px) {
        .crm-splash-title {
          font-size: 24px;
        }
      }
      .crm-splash-tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: rgba(226, 232, 240, 0.85);
        margin-bottom: 24px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      }
      @media (max-width: 480px) {
        .crm-splash-tagline {
          font-size: 12px;
          letter-spacing: 0.05em;
          margin-bottom: 20px;
        }
      }
      /* Desktop horizontal loading bar */
      .crm-splash-loader-bar {
        width: 280px;
        max-width: 80vw;
        height: 5px;
        background-color: #162a45;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 16px;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 12px rgba(10, 37, 74, 0.3);
      }
      .crm-splash-progress-fill {
        height: 100%;
        width: 20%;
        background: linear-gradient(90deg, #dc2626 0%, #ef4444 50%, #f87171 100%);
        border-radius: 9999px;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        transition: width 350ms cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }
      .crm-splash-progress-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        animation: crm-shimmer 1.8s infinite;
      }
      @keyframes crm-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      /* Mobile circular spinner loader */
      .crm-splash-spinner {
        display: none;
        width: 38px;
        height: 38px;
        margin-bottom: 18px;
      }
      .crm-splash-spinner-svg {
        width: 100%;
        height: 100%;
        animation: crm-spinner-rotate 1.1s linear infinite;
        transform-origin: center center;
      }
      .crm-splash-spinner-track {
        stroke: #162a45;
      }
      .crm-splash-spinner-arc {
        stroke: #ef4444;
        stroke-dasharray: 80;
        stroke-dashoffset: 60;
        filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.6));
      }
      @keyframes crm-spinner-rotate {
        100% { transform: rotate(360deg); }
      }
      @media (max-width: 768px) {
        .crm-splash-loader-bar {
          display: none;
        }
        .crm-splash-spinner {
          display: block;
        }
      }
      @media (min-width: 769px) {
        .crm-splash-loader-bar {
          display: block;
        }
        .crm-splash-spinner {
          display: none;
        }
      }
      .crm-splash-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.92);
        margin-bottom: 6px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      }
      .crm-splash-subtext {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.04em;
        color: rgba(148, 163, 184, 0.82);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      .crm-splash-footer {
        position: absolute;
        bottom: max(20px, env(safe-area-inset-bottom, 20px));
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.65);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body class="bg-[#F4F6F8] text-slate-900 antialiased selection:bg-sky-600 selection:text-white font-sans">
    <!-- Immediate Real Code-Based Application Loading Screen (Desktop + Mobile) -->
    <div id="crm-splash-screen" role="status" aria-live="polite" aria-label="Loading Enterprises CRM">
      <div class="crm-splash-container">
        <!-- Official CRM Logo -->
        <div class="crm-splash-logo-wrapper">
          <img
            id="crm-splash-logo"
            src="/crm-logo.png"
            alt="Enterprises CRM"
            class="crm-splash-logo-img"
            width="124"
            height="124"
            loading="eager"
            decoding="sync"
          />
        </div>

        <!-- Application Name -->
        <div id="crm-splash-title" class="crm-splash-title">
          Enterprises <span class="crm-splash-title-crm">CRM</span>
        </div>

        <!-- Tagline -->
        <div class="crm-splash-tagline">
          Manage &middot; Grow &middot; Succeed Together
        </div>

        <!-- Desktop Horizontal Progress Bar -->
        <div class="crm-splash-loader-bar" aria-hidden="true">
          <div id="crm-splash-progress" class="crm-splash-progress-fill"></div>
        </div>

        <!-- Mobile Circular SVG Spinner -->
        <div class="crm-splash-spinner" aria-hidden="true">
          <svg class="crm-splash-spinner-svg" viewBox="0 0 44 44">
            <circle class="crm-splash-spinner-track" cx="22" cy="22" r="18" fill="none" stroke-width="3.5" />
            <circle class="crm-splash-spinner-arc" cx="22" cy="22" r="18" fill="none" stroke-width="3.5" stroke-linecap="round" />
          </svg>
        </div>

        <!-- Loading Text Elements -->
        <div class="crm-splash-text">
          Loading your CRM...
        </div>
        <div class="crm-splash-subtext">
          Building better business relationships
        </div>
      </div>

      <!-- Developer Branding Footer -->
      <div class="crm-splash-footer">
        Developed by Kartik &amp; Siddharth
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
